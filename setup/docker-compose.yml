# Curso SQL Server 2022 Avanzado · entorno de prácticas
# Uso (desde la carpeta setup/):  docker compose up -d
services:
  sql2022:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql2022
    hostname: sql2022
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Curso_SQL2022!"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql      # datos, logs, auditoría y backups
      - ../datos:/datos:ro          # scripts del curso y carga simulada
    deploy:
      resources:
        limits:
          memory: 6g                # recomendado >= 4 GB; ajustar al portátil
volumes:
  sqldata:
